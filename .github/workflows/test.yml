name: Check dashboard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Service and analytics tests
        run: python -m unittest discover -s . -p 'test_*.py'
      - name: Restore bundled runtime and check startup
        run: python run.py --cached-only --check
      - name: Check frontend syntax
        run: |
          for file in report/*.js; do node --check "$file"; done
